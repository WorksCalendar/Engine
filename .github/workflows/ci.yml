name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Least privilege: CI only needs to read the repo. No job here writes to
# GitHub, so deny everything else by default.
permissions:
  contents: read

jobs:
  # Cross-environment compatibility: every supported Node LTS against both
  # supported date-fns majors (peer dep range is ^3.6.0 || ^4.0.0).
  test:
    name: test (node ${{ matrix.node-version }}, date-fns ${{ matrix.date-fns }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22', '24']
        date-fns: ['3', '4']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Exercise the peer dependency at the matrix major. --no-save keeps the
      # committed lockfile authoritative; only the runtime copy is swapped.
      - name: Pin date-fns ${{ matrix.date-fns }}.x
        run: npm install --no-save date-fns@${{ matrix.date-fns }}

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm test

  # Package-integrity and quality gates that are environment-independent —
  # run once on the primary Node version.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Supply-chain gate: fail the build on a known high/critical advisory
      # anywhere in the resolved tree (toolchain included). Lower-severity
      # advisories are surfaced by Dependabot rather than blocking CI.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      # Runs the full suite with coverage and enforces the ratchet-floor
      # thresholds configured in vitest.config.ts (fails on regression).
      - name: Unit tests + coverage
        run: npm run coverage

      - name: Build
        run: npm run build

      # Fail if the public API surface drifted from the committed report
      # (etc/*.api.md). Run after build — it analyzes dist/index.d.ts.
      # Regenerate locally with `npm run api:update` and commit the diff.
      - name: API surface check
        run: npm run api:check

      # Node ESM smoke test: actually load the built package the way a
      # consumer would and confirm the top-level export resolves. Catches the
      # ERR_MODULE_NOT_FOUND class of bugs that bit us during extraction.
      #
      # @arethetypeswrong/cli would be a nice add here, but as of 0.18.x its
      # tarball reader crashes with "Cannot read properties of undefined
      # (reading 'filename')" on this package. publint (below) covers the
      # exports-map subset of what attw checks. Revisit attw once upstream
      # ships a fix.
      - name: Node ESM smoke test
        run: |
          node -e "import('./dist/index.js').then(m => { if (!m.CalendarEngine) throw new Error('CalendarEngine export missing'); if (typeof m.evaluateConflicts !== 'function') throw new Error('evaluateConflicts export missing'); console.log('OK — ' + Object.keys(m).length + ' exports'); })"
          node -e "import('./dist/index.js').then(({ evaluateConflicts }) => { const r = evaluateConflicts({ proposed: { id: 'a', start: new Date(), end: new Date(Date.now()+3600000), resource: 'x' }, events: [], rules: [{ id: 'r', type: 'resource-overlap', severity: 'hard' }] }); if (!r.allowed) throw new Error('expected allowed for empty events'); console.log('OK — evaluateConflicts callable end-to-end'); })"

      # CJS smoke test: confirm the CJS build is loadable via require().
      # The dual ESM+CJS exports map is easy to misconfigure (publint catches
      # the static config errors; this catches runtime resolution errors).
      - name: Node CJS smoke test
        run: |
          node -e "const m = require('./dist/index.cjs'); if (!m.CalendarEngine) throw new Error('CalendarEngine export missing in CJS build'); if (typeof m.evaluateConflicts !== 'function') throw new Error('evaluateConflicts export missing in CJS build'); console.log('OK — CJS ' + Object.keys(m).length + ' exports');"

      # publint: validates the package.json exports map, types resolution,
      # and tarball contents against the npm + Node resolution rules. Cheap,
      # catches a whole class of "ships fine, fails at consumer install" bugs.
      - name: publint
        run: npx -y publint --strict
