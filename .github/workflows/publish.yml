name: Publish

# Push a tag like `v0.1.0` (or `v0.2.0-rc.1`) on the default branch to
# publish that version to npm. The package version in package.json must
# match the tag — the workflow exits non-zero if they disagree.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Needed by `npm publish --provenance` so the published tarball is
      # signed against this workflow run.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "Publishing version $PKG (tag v$TAG)"

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build

      # CycloneDX SBOM for the published tree — increasingly required by
      # enterprise consumers (US EO 14028 / SLSA). Generated from the same
      # locked install that is about to be published.
      - name: Generate SBOM (CycloneDX)
        run: npx -y @cyclonedx/cyclonedx-npm@latest --omit dev --output-format JSON --output-file sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
